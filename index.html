<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<title>Fokus 3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone column, today first; capture bar + tab bar pinned at the bottom for the thumb. Dark-only by choice. */
:root{
  --bg:#111316;
  --surface:#181b20;
  --raised:#20242a;
  --line:#2a2f37;
  --fg:#e7e9ec;
  --muted:#8b929c;
  --faint:#5d636c;
  --accent:#a9b4ff;
  --accent-ink:#14172a;
  --ok:#86d19a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) 170px}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.top-tools{display:flex;justify-content:flex-end;margin-bottom:4px}

h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:22px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* task rows */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 10px 10px 12px;min-height:56px}
.row.done .t{color:var(--faint);text-decoration:line-through}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:border-color .15s,background .15s}
.chk svg{width:14px;height:14px;opacity:0}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .chk svg{opacity:1}
.chk.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.rm{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.t{overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.crumb{display:inline-flex;align-items:center;gap:6px;min-width:0}
.mins{font-family:var(--mono);font-size:.74rem;font-variant-numeric:tabular-nums}
.bat{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.bat i{width:4px;border-radius:1px;background:var(--line)}
.bat i:nth-child(1){height:5px}.bat i:nth-child(2){height:8px}.bat i:nth-child(3){height:11px}
.bat.e1 i:nth-child(-n+1),.bat.e2 i:nth-child(-n+2),.bat.e3 i:nth-child(-n+3){background:var(--muted)}
.btn-s{flex:none;font-size:.82rem;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--raised);color:var(--fg)}
.btn-s:disabled{opacity:.35;cursor:default}
.btn-s.acc{background:var(--accent);color:var(--accent-ink)}
.icon-b{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-b svg{width:18px;height:18px}

/* today slots */
.slots{display:flex;flex-direction:column;gap:8px}
.slot-n{font-family:var(--mono);font-size:.74rem;color:var(--faint);width:14px;flex:none;text-align:center}
.slots .row{min-height:64px;border:1px solid var(--line);background:var(--surface)}
.slot-empty{display:flex;align-items:center;gap:10px;min-height:64px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--faint);font-size:.92rem}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--ok)}
.cheer{background:var(--raised);border-radius:14px;padding:14px;font-size:.95rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .bat i{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.chip[aria-pressed="true"] .bat.e1 i:nth-child(-n+1),.chip[aria-pressed="true"] .bat.e2 i:nth-child(-n+2),.chip[aria-pressed="true"] .bat.e3 i:nth-child(-n+3){background:var(--bg)}
.chip-l{font-size:.78rem;color:var(--faint);width:100%;margin-top:4px}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}

/* inbox */
.inbox-item{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.inbox-top{display:flex;align-items:flex-start;gap:8px}
.inbox-top .rm{padding-top:5px}

/* areas */
.area-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:16px 14px;text-align:left;width:100%}
.area-card .dot{width:12px;height:12px}
.area-card .n{flex:1;min-width:0;font-weight:600}
.area-card .c{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.tree-row{display:flex;align-items:stretch;gap:0}
.tree-row .row{flex:1;min-width:0}
.exp{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.74rem;color:var(--muted);padding:6px 8px;border-radius:8px;background:var(--raised);flex:none}
.exp svg{width:12px;height:12px;transition:transform .15s}
.exp[aria-expanded="true"] svg{transform:rotate(90deg)}
.inline-form{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.field:focus{border-color:var(--accent)}
.empty{color:var(--muted);font-size:.92rem;padding:18px 4px}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.cap{display:flex;gap:8px}
.cap .field{background:var(--surface)}
.cap button{flex:none;width:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.cap button svg{width:20px;height:20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;font-size:.75rem;color:var(--faint);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);font-family:var(--mono);font-size:.66rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet .field{background:var(--bg);font-size:1.05rem}
.sheet-sec{display:flex;flex-direction:column;gap:8px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.danger{color:#f08a8a}
.btn-danger{background:#5a2328;color:#ffd6d6}
.sub-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.sub-row .chk{width:22px;height:22px}
.sub-row .chk svg{width:12px;height:12px}
.sub-row.done .t{color:var(--faint);text-decoration:line-through}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--fg)}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.9rem;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app"><div class="top-tools"><button class="icon-b" data-act="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div><main id="main"><p class="loading">Lädt deine Aufgaben…</p></main></div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<div class="dock">
  <div class="dock-in">
    <form class="cap" id="capf" autocomplete="off">
      <input class="field" id="cap" placeholder="Gedanke rauskippen…" enterkeyhint="done" aria-label="Neue Aufgabe">
      <button type="submit" aria-label="Hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<script>
const COLORS=["#7fa7e8","#e3a86b","#8fcb9b","#d58bb8","#b49ceb","#6fc7c4"];
const ENERGY=[null,"Wenig","Mittel","Viel"];
const S={areas:{},tasks:{},mode:"loading"};
const V={settings:false,importData:null,tab:"today",area:null,open:new Set(),sheet:null,areaSheet:false,confirm:false,energy:0,time:0,fresh:false,pop:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- storage ---------- */
const LS="fokus3-v1";
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){S.areas=r.areas||{};S.tasks=r.tasks||{}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({areas:S.areas,tasks:S.tasks}))}catch(e){}}
function put(coll,id,data){S[coll][id]=data;lsSave();render()}
function patch(coll,id,p){const cur=S[coll][id];if(!cur)return;S[coll][id]={...cur,...p};lsSave();render()}
function drop(coll,id){delete S[coll][id];lsSave();render()}

/* ---------- queries ---------- */
const tasks=()=>Object.entries(S.tasks).map(([id,t])=>({id,...t}));
const areaList=()=>Object.entries(S.areas).map(([id,a])=>({id,...a})).sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name));
const byOpenThenAge=(a,b)=>(a.status==="done")-(b.status==="done")||(a.createdAt||0)-(b.createdAt||0);
const kids=id=>tasks().filter(t=>t.parentId===id).sort(byOpenThenAge);
function descendants(id){const out=[];const walk=p=>kids(p).forEach(k=>{out.push(k.id);walk(k.id)});walk(id);return out}
const hasOpenKids=id=>tasks().some(t=>t.parentId===id&&t.status!=="done");
const inbox=()=>tasks().filter(t=>!t.areaId&&!t.parentId&&t.status!=="done").sort((a,b)=>b.createdAt-a.createdAt);
const todayAll=()=>tasks().filter(t=>t.todayDate===todayKey()).sort((a,b)=>(a.todayAt||0)-(b.todayAt||0));
const todayOpen=()=>todayAll().filter(t=>t.status!=="done");
const todayDone=()=>todayAll().filter(t=>t.status==="done");

function suggestions(){
  const tk=todayKey();
  return tasks().filter(t=>t.status!=="done"&&t.areaId&&t.todayDate!==tk&&!hasOpenKids(t.id))
    .filter(t=>!V.energy||!t.energy||t.energy<=V.energy)
    .filter(t=>!V.time||!t.minutes||t.minutes<=V.time)
    .map(t=>({t,score:(V.energy&&!t.energy?1:0)+(V.time&&!t.minutes?1:0)}))
    .sort((a,b)=>a.score-b.score||(a.t.createdAt||0)-(b.t.createdAt||0))
    .slice(0,5).map(x=>x.t);
}

/* ---------- actions ---------- */
function addTask({title,areaId=null,parentId=null}){
  title=title.trim();if(!title)return;
  put("tasks",uid(),{title,areaId,parentId,status:"open",energy:0,minutes:0,todayDate:"",todayAt:0,createdAt:Date.now(),doneAt:0});
}
function toggleDone(id){
  const t=S.tasks[id];if(!t)return;
  const done=t.status!=="done";
  V.pop=done?id:null;
  patch("tasks",id,{status:done?"done":"open",doneAt:done?Date.now():0});
  if(done&&t.todayDate===todayKey()){
    const n=todayDone().length,all=todayAll().length;
    toast(todayOpen().length===0?"Alle für heute erledigt. Stark!":`Erledigt. ${n} von ${all} geschafft.`);
  }
}
function setToday(id,on){
  if(on&&todayOpen().length>=3){toast("Heute sind schon 3 offen. Erst eins abhaken.");return}
  patch("tasks",id,on?{todayDate:todayKey(),todayAt:Date.now()}:{todayDate:"",todayAt:0});
}
function setArea(id,areaId){
  [id,...descendants(id)].forEach(x=>patch("tasks",x,{areaId}));
}
function deleteTask(id){
  for(const x of [...descendants(id),id]) delete S.tasks[x];
  lsSave();render();
}

/* ---------- pieces ---------- */
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#111316" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
};
const bat=e=>`<span class="bat e${e}" aria-label="${ENERGY[e]||""} Energie"><i></i><i></i><i></i></span>`;
function fmtMin(m){return m>=60?(m/60)+" h":m+" min"}
function crumb(t,{showArea=true}={}){
  const a=t.areaId&&S.areas[t.areaId];const p=t.parentId&&S.tasks[t.parentId];
  const parts=[];
  if(showArea&&a)parts.push(`<span class="crumb"><span class="dot" style="background:${esc(a.color)}"></span>${esc(a.name)}${p?" › "+esc(p.title):""}</span>`);
  else if(p)parts.push(`<span class="crumb">› ${esc(p.title)}</span>`);
  if(t.energy)parts.push(bat(t.energy));
  if(t.minutes)parts.push(`<span class="mins">${fmtMin(t.minutes)}</span>`);
  return parts.length?`<span class="meta">${parts.join("")}</span>`:"";
}
function row(t,{trail="",showArea=true}={}){
  return `<div class="row${t.status==="done"?" done":""}">
    <button class="chk${V.pop===t.id?" pop":""}" data-act="toggle" data-id="${t.id}" aria-label="${t.status==="done"?"Wieder öffnen":"Abhaken"}">${ICON.check}</button>
    <button class="rm" data-act="open" data-id="${t.id}"><span class="t">${esc(t.title)}</span>${crumb(t,{showArea})}</button>${trail}</div>`;
}

/* ---------- views ---------- */
function viewToday(){
  const d=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const open=todayOpen(),done=todayDone(),total=open.length+done.length;
  const all=todayAll();
  let slots=all.map((t,i)=>`<div style="display:flex;align-items:center;gap:8px"><span class="slot-n">${i+1}</span><div style="flex:1;min-width:0">${row(t,{trail:t.status==="done"?"":`<button class="icon-b" data-act="unToday" data-id="${t.id}" aria-label="Aus Heute entfernen">${ICON.x}</button>`})}</div></div>`).join("");
  for(let i=all.length;i<3;i++)slots+=`<div style="display:flex;align-items:center;gap:8px"><span class="slot-n">${i+1}</span><div class="slot-empty" style="flex:1">Freier Slot</div></div>`;
  const prog=total?`<div class="progress">${todayAll().map(t=>`<i class="${t.status==="done"?"on":""}"></i>`).join("")}</div>`:"";
  const sug=suggestions();
  const full=open.length>=3;
  const eChips=[1,2,3].map(e=>`<button class="chip" data-act="energy" data-v="${e}" aria-pressed="${V.energy===e}">${bat(e)}${ENERGY[e]}</button>`).join("");
  const tChips=[15,30,60].map(m=>`<button class="chip" data-act="time" data-v="${m}" aria-pressed="${V.time===m}">bis ${fmtMin(m)}</button>`).join("");
  return `<div class="head"><span class="eyebrow">${esc(d)}</span><h1>Deine 3 für heute</h1><p class="sub">Nur das zählt heute. Alles andere wartet.</p></div>
  ${prog}
  <div class="slots" style="margin-top:14px">${slots}</div>
  ${total>=3&&!open.length?`<div class="cheer" style="margin-top:12px">Alle ${total} erledigt. Du kannst Feierabend machen oder dir unten einen Bonus holen.</div>`:""}
  <div class="sec">
    <div class="sec-h"><h2>Was passt gerade?</h2></div>
    <div class="chips"><span class="chip-l">Wie viel Energie hast du?</span>${eChips}<span class="chip-l">Wie viel Zeit?</span>${tChips}</div>
    <div class="list" style="margin-top:6px">${sug.length?sug.map(t=>row(t,{trail:`<button class="btn-s acc" data-act="toToday" data-id="${t.id}" ${full?"disabled":""}>Heute</button>`})).join(""):`<p class="empty">${!tasks().some(t=>t.areaId&&t.status!=="done")?"Noch keine einsortierten Aufgaben. Kipp sie unten rein und sortier sie in der Inbox.":(V.energy||V.time)?"Nichts passt zu dieser Auswahl. Lockere die Filter.":"Keine weiteren Aufgaben bereit. Neue kommen über die Inbox dazu."}</p>`}</div>
    ${sug.length&&!V.energy&&!V.time?`<p class="sub">Tipp: Gib Aufgaben Energie und Dauer, dann trifft der Vorschlag besser.</p>`:""}
  </div>`;
}
function viewInbox(){
  const items=inbox(),areas=areaList();
  return `<div class="head"><span class="eyebrow">Inbox · ${items.length}</span><h1>Erst raus, dann sortieren</h1><p class="sub">Tipp einen Bereich an, um die Aufgabe einzusortieren.</p></div>
  <div class="list">${items.length?items.map(t=>`<div class="inbox-item">
    <div class="inbox-top"><button class="rm" data-act="open" data-id="${t.id}"><span class="t">${esc(t.title)}</span>${crumb(t)}</button>
    <button class="icon-b" data-act="quickDel" data-id="${t.id}" aria-label="Löschen">${ICON.x}</button></div>
    <div class="scroller">${areas.map(a=>`<button class="chip" data-act="sort" data-id="${t.id}" data-area="${a.id}"><span class="dot" style="background:${esc(a.color)}"></span>${esc(a.name)}</button>`).join("")}</div>
  </div>`).join(""):`<p class="empty">Inbox ist leer. Alles, was dir durch den Kopf geht, kommt unten ins Feld.</p>`}</div>`;
}
function tree(parentId,areaId,depth){
  const list=parentId?kids(parentId):tasks().filter(t=>t.areaId===areaId&&!t.parentId).sort(byOpenThenAge);
  return list.map(t=>{
    const k=tasks().filter(x=>x.parentId===t.id);
    const isOpen=V.open.has(t.id);
    const exp=k.length?`<button class="exp" data-act="expand" data-id="${t.id}" aria-expanded="${isOpen}" aria-label="Unteraufgaben">${ICON.chev}${k.filter(x=>x.status==="done").length}/${k.length}</button>`:"";
    return `<div style="padding-left:${Math.min(depth,4)*16}px">${row(t,{trail:exp,showArea:false})}</div>${k.length&&isOpen?tree(t.id,areaId,depth+1):""}`;
  }).join("");
}
function viewAreas(){
  if(V.area&&S.areas[V.area]){
    const a=S.areas[V.area];
    const top=tasks().filter(t=>t.areaId===V.area&&!t.parentId);
    return `<button class="back" data-act="areaBack">${ICON.chev.replace('d="M9 6l6 6-6 6"','d="M15 6l-6 6 6 6"').replace("<svg ",'<svg width="16" height="16" ')} Bereiche</button>
    <div class="head" style="flex-direction:row;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="dot" style="width:14px;height:14px;background:${esc(a.color)}"></span><h1 style="min-width:0;overflow-wrap:anywhere">${esc(a.name)}</h1></div>
    <button class="icon-b" data-act="editArea" aria-label="Bereich bearbeiten">${ICON.dots}</button></div>
    <div class="list">${top.length?tree(null,V.area,0):`<p class="empty">Noch nichts hier. Was du unten eintippst, landet direkt in diesem Bereich.</p>`}</div>`;
  }
  const areas=areaList();
  return `<div class="head"><span class="eyebrow">Bereiche</span><h1>Dein Überblick</h1><p class="sub">Projekte und Aufgaben, sortiert nach Lebensbereich.</p></div>
  <div class="list">${areas.map(a=>{const n=tasks().filter(t=>t.areaId===a.id&&t.status!=="done").length;
    return `<button class="area-card" data-act="area" data-id="${a.id}"><span class="dot" style="background:${esc(a.color)}"></span><span class="n">${esc(a.name)}</span><span class="c">${n} offen</span><span style="color:var(--faint);display:grid">${ICON.chev.replace("<svg ",'<svg width="16" height="16" ')}</span></button>`}).join("")}</div>
  <form class="inline-form" id="naf" style="margin-top:14px" autocomplete="off"><input class="field" id="na" data-keep placeholder="Neuer Bereich, z. B. Sport" aria-label="Neuer Bereich"><button class="btn-s" type="submit">Anlegen</button></form>`;
}

function sheetTask(){
  const t=S.tasks[V.sheet];if(!t)return"";
  const id=V.sheet,isTop=!t.parentId;
  const sub=kids(id),desc=descendants(id).length;
  const onToday=t.todayDate===todayKey();
  const areaChips=[`<button class="chip" data-act="sArea" data-area="" aria-pressed="${!t.areaId}">Inbox</button>`,...areaList().map(a=>`<button class="chip" data-act="sArea" data-area="${a.id}" aria-pressed="${t.areaId===a.id}"><span class="dot" style="background:${esc(a.color)}"></span>${esc(a.name)}</button>`)].join("");
  return `<div class="scrim" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Aufgabe">
    <div class="grab"></div>
    ${t.parentId&&S.tasks[t.parentId]?`<button class="back" style="margin:0" data-act="open" data-id="${t.parentId}">${ICON.chev.replace('d="M9 6l6 6-6 6"','d="M15 6l-6 6 6 6"').replace("<svg ",'<svg width="16" height="16" ')} ${esc(S.tasks[t.parentId].title)}</button>`:""}
    <input class="field" id="st" data-keep value="${esc(t.title)}" aria-label="Titel">
    ${isTop?`<div class="sheet-sec"><span class="eyebrow">Bereich</span><div class="chips">${areaChips}</div></div>`:""}
    <div class="sheet-sec"><span class="eyebrow">Energie</span><div class="chips">${[1,2,3].map(e=>`<button class="chip" data-act="sEnergy" data-v="${e}" aria-pressed="${t.energy===e}">${bat(e)}${ENERGY[e]}</button>`).join("")}</div></div>
    <div class="sheet-sec"><span class="eyebrow">Dauer</span><div class="chips">${[5,15,30,60,120].map(m=>`<button class="chip" data-act="sMin" data-v="${m}" aria-pressed="${t.minutes===m}">${fmtMin(m)}</button>`).join("")}</div></div>
    <div class="sheet-sec"><span class="eyebrow">Unteraufgaben${sub.length?" · "+sub.filter(s=>s.status==="done").length+"/"+sub.length:""}</span>
      ${sub.map(s=>`<div class="sub-row${s.status==="done"?" done":""}"><button class="chk" data-act="toggle" data-id="${s.id}" aria-label="Abhaken">${ICON.check}</button><button class="rm" data-act="open" data-id="${s.id}"><span class="t">${esc(s.title)}</span></button></div>`).join("")}
      <form class="inline-form" id="subf" autocomplete="off"><input class="field" id="sub" data-keep placeholder="In kleinere Schritte zerlegen…" aria-label="Neue Unteraufgabe" style="font-size:1rem"><button class="btn-s" type="submit">Plus</button></form>
    </div>
    <div class="sheet-foot">
      ${V.confirm?`<span class="danger" style="font-size:.9rem">Löschen${desc?` inkl. ${desc} Unteraufgabe${desc>1?"n":""}`:""}?</span><span style="display:flex;gap:8px"><button class="btn-s" data-act="noDel">Nein</button><button class="btn-s btn-danger" data-act="yesDel">Löschen</button></span>`
      :`<button class="btn-s danger" style="background:none" data-act="askDel">Löschen</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap">${t.status!=="done"?`<button class="btn-s" data-act="${onToday?"unToday":"toToday"}" data-id="${id}">${onToday?"Aus Heute":"Für heute"}</button>`:""}
      <button class="btn-s acc" data-act="toggle" data-id="${id}">${t.status==="done"?"Wieder öffnen":"Erledigt"}</button></span>`}
    </div></div></div>`;
}
function sheetArea(){
  const a=S.areas[V.area];if(!a)return"";
  const used=tasks().some(t=>t.areaId===V.area);
  return `<div class="scrim" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Bereich bearbeiten">
    <div class="grab"></div><h2>Bereich bearbeiten</h2>
    <input class="field" id="an" data-keep value="${esc(a.name)}" aria-label="Name">
    <div class="chips">${COLORS.map(c=>`<button class="swatch" style="background:${c}" data-act="aColor" data-v="${c}" aria-pressed="${a.color===c}" aria-label="Farbe"></button>`).join("")}</div>
    <div class="sheet-foot">${used?`<span class="sub" style="margin:0">Löschen geht, sobald der Bereich leer ist.</span>`:`<button class="btn-s btn-danger" data-act="delArea">Bereich löschen</button>`}<button class="btn-s acc" data-act="close">Fertig</button></div>
  </div></div>`;
}

/* ---------- render ---------- */
function render(){
  if(S.mode==="loading")return;
  const ae=document.activeElement,fid=ae&&ae.id,keep={};
  if(!V.fresh)document.querySelectorAll("[data-keep]").forEach(i=>keep[i.id]=i.value);
  V.fresh=false;
  $("#main").innerHTML=V.tab==="today"?viewToday():V.tab==="inbox"?viewInbox():viewAreas();
  $("#sheet").innerHTML=V.settings?sheetSettings():V.sheet?sheetTask():V.areaSheet?sheetArea():"";
  for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  if(fid&&fid!=="cap"){const el=document.getElementById(fid);if(el)el.focus()}
  const n=inbox().length;
  const tab=(k,label,svg)=>`<button class="tab" data-act="tab" data-v="${k}" ${V.tab===k?'aria-current="page"':""}>${svg}${label}${k==="inbox"&&n?`<span class="badge">${n}</span>`:""}</button>`;
  $("#tabs").innerHTML=
    tab("today","Heute",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>')+
    tab("inbox","Inbox",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13v5H4z"/><path d="M4 13h4.5a3.5 3.5 0 007 0H20"/></svg>')+
    tab("areas","Bereiche",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>');
  const inArea=V.tab==="areas"&&V.area&&S.areas[V.area];
  $("#cap").placeholder=inArea?`Neu in ${S.areas[V.area].name}…`:"Gedanke rauskippen…";
  V.pop=null;
}
let tt;function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
function openSheet(id){V.sheet=id;V.areaSheet=false;V.confirm=false;V.fresh=true;render()}
function closeSheet(){commitTitle();V.settings=false;V.importData=null;V.sheet=null;V.areaSheet=false;V.confirm=false;V.fresh=true;render()}
function commitTitle(){
  const st=document.getElementById("st");if(st&&V.sheet&&S.tasks[V.sheet]){const v=st.value.trim();if(v&&v!==S.tasks[V.sheet].title)patch("tasks",V.sheet,{title:v})}
  const an=document.getElementById("an");if(an&&V.areaSheet&&S.areas[V.area]){const v=an.value.trim();if(v&&v!==S.areas[V.area].name)patch("areas",V.area,{name:v})}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(act==="closeBg"&&e.target!==b)return;
  switch(act){
    case "tab":V.tab=v;V.area=null;render();scrollTo(0,0);break;
    case "toggle":toggleDone(id);break;
    case "open":commitTitle();openSheet(id);break;
    case "close":case "closeBg":closeSheet();break;
    case "toToday":setToday(id,true);break;
    case "unToday":setToday(id,false);break;
    case "energy":V.energy=V.energy===+v?0:+v;render();break;
    case "time":V.time=V.time===+v?0:+v;render();break;
    case "sort":setArea(id,b.dataset.area);toast("Einsortiert in "+S.areas[b.dataset.area].name);break;
    case "quickDel":deleteTask(id);break;
    case "area":V.area=id;render();scrollTo(0,0);break;
    case "areaBack":V.area=null;render();break;
    case "expand":V.open.has(id)?V.open.delete(id):V.open.add(id);render();break;
    case "editArea":V.areaSheet=true;V.sheet=null;V.fresh=true;render();break;
    case "aColor":patch("areas",V.area,{color:v});break;
    case "delArea":{const aid=V.area;V.areaSheet=false;V.area=null;V.fresh=true;drop("areas",aid);break}
    case "sArea":setArea(V.sheet,b.dataset.area||null);break;
    case "sEnergy":patch("tasks",V.sheet,{energy:S.tasks[V.sheet].energy===+v?0:+v});break;
    case "sMin":patch("tasks",V.sheet,{minutes:S.tasks[V.sheet].minutes===+v?0:+v});break;
    case "askDel":V.confirm=true;render();break;
    case "noDel":V.confirm=false;render();break;
    case "settings":V.settings=true;V.sheet=null;V.areaSheet=false;V.fresh=true;render();break;
    case "export":exportBackup();break;
    case "import":$("#importFile").value="";$("#importFile").click();break;
    case "importYes":applyImport();break;
    case "importNo":V.importData=null;render();break;
    case "yesDel":{const tid=V.sheet,parent=S.tasks[tid]?.parentId;V.sheet=parent&&S.tasks[parent]?parent:null;V.confirm=false;V.fresh=true;deleteTask(tid);break}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="st"||e.target.id==="an")commitTitle()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(V.sheet||V.areaSheet||V.settings))closeSheet();
  if(e.key==="Enter"&&(e.target.id==="st"||e.target.id==="an")){e.preventDefault();e.target.blur()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.id;
  if(f==="capf"){const i=$("#cap"),v=i.value;i.value="";
    const inArea=V.tab==="areas"&&V.area&&S.areas[V.area];
    addTask({title:v,areaId:inArea?V.area:null});
    if(v.trim()&&!inArea)toast("In der Inbox");
  }
  if(f==="subf"){const i=$("#sub"),v=i.value;i.value="";const p=S.tasks[V.sheet];if(p){addTask({title:v,areaId:p.areaId,parentId:V.sheet});V.open.add(V.sheet)}}
  if(f==="naf"){const i=$("#na"),v=i.value.trim();i.value="";if(v)put("areas",uid(),{name:v,color:COLORS[areaList().length%COLORS.length],order:areaList().length})}
});

/* ---------- backup ---------- */
function sheetSettings(){
  const nT=Object.keys(S.tasks).length,nA=Object.keys(S.areas).length;
  return `<div class="scrim" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Einstellungen">
    <div class="grab"></div><h2>Deine Daten</h2>
    <p class="sub" style="margin:0">${nT} Aufgaben in ${nA} Bereichen, gespeichert nur auf diesem Gerät.</p>
    <div class="sheet-sec"><span class="eyebrow">Backup</span>
      <p class="sub" style="margin:0">Speichert alles als Datei in deinen Downloads. Nur wenn du tippst, nie automatisch.</p>
      <div><button class="btn-s acc" data-act="export">Backup speichern</button></div>
    </div>
    <div class="sheet-sec"><span class="eyebrow">Wiederherstellen</span>
      ${V.importData?`<p class="danger" style="margin:0;font-size:.92rem">Backup mit ${Object.keys(V.importData.tasks).length} Aufgaben laden? Deine jetzigen Daten werden dabei ersetzt.</p>
      <div style="display:flex;gap:8px"><button class="btn-s" data-act="importNo">Abbrechen</button><button class="btn-s btn-danger" data-act="importYes">Ersetzen</button></div>`
      :`<p class="sub" style="margin:0">Lädt eine Backup-Datei und ersetzt die aktuellen Daten.</p><div><button class="btn-s" data-act="import">Backup laden</button></div>`}
    </div>
    <div class="sheet-foot"><span></span><button class="btn-s acc" data-act="close">Fertig</button></div>
  </div></div>`;
}
function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify({app:"fokus3",version:1,savedAt:new Date().toISOString(),areas:S.areas,tasks:S.tasks},null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="fokus3-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Backup gespeichert (Downloads)");
  }catch(e){toast("Backup hat nicht geklappt.")}
}
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    const ok=d&&typeof d.areas==="object"&&d.areas&&typeof d.tasks==="object"&&d.tasks&&!Array.isArray(d.tasks);
    if(!ok)throw 0;
    V.importData={areas:d.areas,tasks:d.tasks};render();
  }catch(_){toast("Das ist keine gültige Fokus-3-Backup-Datei.")}};
  r.onerror=()=>toast("Datei konnte nicht gelesen werden.");
  r.readAsText(f);
});
function applyImport(){
  if(!V.importData)return;
  S.areas=V.importData.areas;S.tasks=V.importData.tasks;V.importData=null;V.settings=false;V.area=null;V.fresh=true;
  lsSave();render();toast("Backup geladen");
}

/* ---------- boot ---------- */
function boot(){
  S.mode="local";lsLoad();
  if(!Object.keys(S.areas).length&&!Object.keys(S.tasks).length){
    ["Job","YouTube","Engineering","Privat"].forEach((n,i)=>S.areas["a"+i]={name:n,color:COLORS[i],order:i});
    ["Caleb-Shorts","Finanz-Kanal","Reddit-Reaction-Kanal"].forEach((n,i)=>S.tasks["p"+i]={title:n,areaId:"a1",parentId:null,status:"open",energy:0,minutes:0,todayDate:"",todayAt:0,createdAt:Date.now()+i,doneAt:0});
    lsSave();
  }
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
</script>

</body>
</html>
